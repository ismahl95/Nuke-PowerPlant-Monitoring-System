name: CI/CD Workflow

on:
  push:
    branches:
      - 'main'
      - 'release'
  pull_request:
    branches:
      - '**'

env:
  JAVA_VERSION: '17'

jobs:
  # ── Validar mensajes de commit (solo en PRs) ──────────────────────────────
  commit-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get all commit messages
        id: get_commit_messages
        run: |
          commits=$(git log origin/main..HEAD --pretty=format:"%s")
          printf "MESSAGES<<EOF\n$commits\nEOF" >> $GITHUB_ENV
      - name: Check Conventional Commits
        run: |
          regex="^(feat|fix|docs|style|refactor|test|build|ci|cd|perf|revert|chore|ui|ux|security|config|localization|hotfix|merge|env|wip|ci-test|data|prototype|a11y|deps|seo|db|analytics|types|mock|validation|rollback|infra|responsive|logging|migration|deprecate|cache|asset|backup|tracking|monitoring|script|scheduler|init)(\\([a-zA-Z0-9_-]+\\))?!?: .+"
          error=false
          count=0
          while IFS= read -r msg; do
            if [ $count -eq 0 ]; then
              echo "ℹ️  Ignoring first commit message: '$msg'"
              count=$((count + 1))
              continue
            fi
            if [[ ! $msg =~ $regex ]]; then
              echo "❌ Commit message does not follow Conventional Commits: '$msg'"
              error=true
            fi
            count=$((count + 1))
          done <<< "${MESSAGES}"
          if [ "$error" = true ]; then
            exit 1
          fi

  # ── CI: compile + test + jacoco (una sola ejecución de Maven) ────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build, test and generate JaCoCo report
        run: mvn clean verify
        working-directory: backend

      - name: Rename JAR to app.jar
        run: cp backend/target/nuke-powerplant-back-*.jar backend/target/app.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: backend/target/app.jar
          retention-days: 1

      - name: Upload JaCoCo report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 1

  # ── SonarCloud: reutiliza el reporte JaCoCo ya generado ──────────────────
  sonarcloud:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necesario para blame info de Sonar

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      - name: Compile (needed for Sonar java binaries)
        working-directory: backend
        run: mvn -B -DskipTests clean compile

      - name: Analyze with SonarCloud
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=ismahl95_Nuke-PowerPlant-Monitoring-System \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.binaries=target/classes

  # ── Deploy: solo en release, solo ismahl95, reutiliza el JAR ─────────────
  deploy:
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.ref == 'refs/heads/release' && github.actor == 'ismahl95'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: backend/target/

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/npms-backend:testing